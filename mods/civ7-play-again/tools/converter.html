<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>文明 VII · 从存档提取开局设置</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101923;color:#f1eadb}body{max-width:760px;margin:7vh auto;padding:24px}h1{font-size:30px;margin-bottom:12px}p{line-height:1.7;color:#b9c5d1}main{border:1px solid #756745;background:#192430;padding:28px;border-radius:16px;margin-top:30px}label{display:block;margin:18px 0 10px}input,select,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #687780;background:#101923;color:inherit}input,select{box-sizing:border-box;width:100%}select{height:250px}button{cursor:pointer;margin-top:20px}button.primary{background:#d8bf83;color:#161c23;border-color:#d8bf83;font-weight:700}button:disabled{opacity:.5;cursor:wait}#result{white-space:pre-wrap;line-height:1.8;margin-top:22px}small{color:#9eafba}#result.error{color:#ffb4a7}
</style>
<h1>从存档提取开局设置</h1>
<p>选一个存档，另存成游戏自带的“游戏设置”。再到新建游戏读取它，就能换领袖、文明、纪念物，或保留原设置直接开始。</p>
<main><small>仅在本机运行 · 原存档保持原样 · 生成独立文件</small>
<label for="filter">查找存档</label><input id="filter" placeholder="输入名字，例如：伊莎贝拉">
<label for="saves">选择最初时代的存档</label><select id="saves" size="8"></select>
<button id="convert" class="primary" disabled>保存为新的游戏设置</button> <button id="refresh">刷新列表</button>
<div id="result" role="status"></div><div id="pages"></div></main>
<p>如果存档已跨时代，请选择最初时代的存档。界面模组会适配本机已安装版本；影响游戏规则的模组不会自动替换。</p>
<script type="module">
import {renderContentReport} from './content-requirements.js';
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);let saves=[],busy=false;
const list=document.querySelector('#saves'),result=document.querySelector('#result'),button=document.querySelector('#convert');
async function api(route,body){const response=await fetch(route,{method:body?'POST':'GET',headers:{'X-Play-Again-Token':token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});if(response.status===403)throw Error('请用本地工具窗口中显示的完整链接打开此页面。');const data=await response.json();if(!response.ok){const error=Error(data.error||'操作失败');error.content=data.content;throw error;}return data;}
function render(){const query=document.querySelector('#filter').value.toLowerCase();const selected=list.value;list.replaceChildren();for(const save of saves.filter(s=>s.name.toLowerCase().includes(query))){const option=document.createElement('option');option.value=save.id;option.textContent=save.name+' · '+save.id.replace(/^Single\//,'');list.append(option);}if([...list.options].some(o=>o.value===selected))list.value=selected;button.disabled=busy||!list.value;}
function showReport(report,message,page=0){result.className='';renderContentReport(result,report,message,page);const nav=document.querySelector('#pages');nav.replaceChildren();const count=Math.ceil((report.required.length+report.recommended.length)/5);for(const [label,target] of [['上一页',page-1],['下一页',page+1]]){if(target<0||target>=count)continue;const control=document.createElement('button');control.textContent=label;control.addEventListener('click',()=>showReport(report,message,target));nav.append(control);}}
function fail(error){document.querySelector('#pages').replaceChildren();if(error.content?.report){showReport({...error.content.report,note:'浏览器只能检查安装文件；DLC 使用权限请在游戏内点击“检查 DLC 和 MOD”核对。'},error.message.split('\n')[0]);}else{result.className='error';result.textContent=error.message;}}
async function refresh(){try{saves=await api('/saves');render();}catch(error){fail(error);}}
document.querySelector('#filter').addEventListener('input',render);document.querySelector('#refresh').addEventListener('click',refresh);list.addEventListener('change',()=>button.disabled=busy||!list.value);
button.addEventListener('click',async()=>{if(busy)return;busy=true;button.disabled=true;result.className='';document.querySelector('#pages').replaceChildren();result.textContent='正在提取开局设置……';try{const data=await api('/convert',{id:list.value});const message='已保存：'+data.fileName+'\n\n回到游戏 → 新建游戏第一屏的“读取游戏设置” → 选择这个文件。\n随后可以更换领袖、文明和纪念物，或直接启动游戏。\n\n游戏种子：'+data.seeds.game+'　地图种子：'+data.seeds.map;result.textContent=message;if(data.content?.report?.recommended.length)showReport(data.content.report,message);}catch(error){fail(error);}finally{busy=false;button.disabled=!list.value;}});refresh();
</script></html>
